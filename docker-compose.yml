services:
  marzneshin:
    image: dawsh/marzneshin:latest
    restart: always
    env_file: .env
    network_mode: host
    environment:
      SQLALCHEMY_DATABASE_URL: "sqlite:////var/lib/marzneshin/db.sqlite3"
    volumes:
      - /var/lib/marzneshin:/var/lib/marzneshin

  marznode:
    image: dawsh/marznode:latest
    restart: always
    network_mode: host
    environment:
      SERVICE_ADDRESS: "127.0.0.1"
      INSECURE: "True"
      XRAY_EXECUTABLE_PATH: "/usr/local/bin/xray"
      XRAY_ASSETS_PATH: "/usr/local/lib/xray"
      XRAY_CONFIG_PATH: "/var/lib/marznode/xray_config.json"
      SING_BOX_EXECUTABLE_PATH: "/usr/local/bin/sing-box"
      HYSTERIA_EXECUTABLE_PATH: "/usr/local/bin/hysteria"
      SSL_KEY_FILE: "/etc/opt/marzneshin/certs/privkey.pem"
      SSL_CERT_FILE: "/etc/opt/marzneshin/certs/fullchain.pem"
    volumes:
      - /var/lib/marznode:/var/lib/marznode
      - /etc/opt/marzneshin/certs:/etc/opt/marzneshin/certs:ro

  nginx:
    image: nginx:latest
    restart: always
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/marzneshin:/var/lib/marzneshin:ro
      - /var/lib/marznode:/var/lib/marznode:ro
      - /etc/opt/marzneshin/certs:/etc/nginx/certs:ro
      - /var/www/html:/var/www/html:ro

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    restart: always
    network_mode: host
    volumes:
      - ./singbox.json:/etc/sing-box/config.json
      - /etc/opt/marzneshin/certs:/etc/opt/marzneshin/certs:ro
      - /var/log/sing-box:/var/log/sing-box
    command: run -c /etc/sing-box/config.json

  wgcf-warp:
    image: linuxserver/wireguard
    container_name: wgcf-warp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - /etc/opt/marzneshin/wgcf:/config
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: always
    networks:
      - marzneshin-net

networks:
  marzneshin-net:
    driver: bridge
