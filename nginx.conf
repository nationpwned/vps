events {}

http {
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name nextg.sibondt.my.id;
        http2 on;
        root /var/www/html;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Redirect root path to dashboard
        location = / {
            return 301 https://$host/dashboard/;
        }

        # Proxy for marzneshin dashboard and API
        location ~* /(dashboard|static|locales|api|docs|redoc|openapi.json) {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy for VLESS over HTTP/2
        location /vless-http2 {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:8443/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy for VLESS over WebSocket
        location /vless-ws {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:8444/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy for Trojan over TCP/TLS
        location /trojan-tcp {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:8445/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy for VLESS over gRPC
        location /vless-grpc {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:8446/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            grpc_pass grpc://127.0.0.1:8446;
        }
    }
}
